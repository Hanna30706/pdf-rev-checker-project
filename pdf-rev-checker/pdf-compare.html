<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 비교 도구_한나 작업 2_commit_한나 작업 추가</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(13, 71, 161, 0.15);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #1976d2;
            padding-bottom: 20px;
        }

        h1 {
            color: #0d47a1;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #1565c0;
            font-size: 1.1em;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #1976d2;
            border-radius: 8px;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
            transition: all 0.3s ease;
        }

        .upload-box:hover {
            background: #e3f2fd;
            border-color: #0d47a1;
        }

        .upload-box h3 {
            color: #0d47a1;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
        }

        .file-label:hover {
            background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(13, 71, 161, 0.3);
        }

        .file-name {
            display: block;
            margin-top: 10px;
            color: #1565c0;
            font-weight: 600;
            word-break: break-word;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 14px 32px;
            font-size: 1.1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .compare-btn {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
            min-width: 150px;
        }

        .compare-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(13, 71, 161, 0.4);
        }

        .compare-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .reset-btn {
            background: #757575;
            color: white;
        }

        .reset-btn:hover {
            background: #616161;
            transform: translateY(-2px);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #e3f2fd;
            border-top: 4px solid #1976d2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #1565c0;
            font-weight: 600;
        }

        .comparison-section {
            display: none;
            margin-top: 40px;
        }

        .comparison-section.show {
            display: block;
        }

        .comparison-title {
            color: #0d47a1;
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 2px solid #1976d2;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px rgba(13, 71, 161, 0.1);
        }

        th {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 1.05em;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e3f2fd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .before-col {
            width: 50%;
            vertical-align: top;
        }

        .after-col {
            width: 50%;
            vertical-align: top;
        }

        .added {
            background: #c8e6c9;
            color: #1b5e20;
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 4px solid #388e3c;
        }

        .removed {
            background: #ffcdd2;
            color: #b71c1c;
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 4px solid #d32f2f;
            text-decoration: line-through;
        }

        .modified {
            background: #bbdefb;
            color: #0d47a1;
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 4px solid #1976d2;
            font-weight: 600;
        }

        .same {
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #1976d2;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #0d47a1;
        }

        .stat-label {
            font-size: 0.9em;
            color: #1565c0;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #d32f2f;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 1024px) {
            .upload-section {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            table {
                font-size: 0.9em;
            }

            td {
                padding: 10px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 PDF 비교 도구</h1>
            <p class="subtitle">두 개의 PDF 파일을 업로드하여 변경사항을 한눈에 비교하세요</p>
        </header>

        <div class="upload-section">
            <div class="upload-box">
                <h3>📋 이전 버전 (Before)</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="file1" accept=".pdf" />
                    <label for="file1" class="file-label">파일 선택</label>
                    <span class="file-name" id="file1-name"></span>
                </div>
            </div>
            <div class="upload-box">
                <h3>📋 새로운 버전 (After)</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="file2" accept=".pdf" />
                    <label for="file2" class="file-label">파일 선택</label>
                    <span class="file-name" id="file2-name"></span>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="compare-btn" id="compareBtn" disabled>비교하기</button>
            <button class="reset-btn" id="resetBtn">초기화</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">PDF를 분석 중입니다...</div>
        </div>

        <div class="error" id="error"></div>

        <div class="comparison-section" id="comparisonSection">
            <div class="comparison-title">📊 비교 결과</div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="addedCount">0</div>
                    <div class="stat-label">추가됨</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="removedCount">0</div>
                    <div class="stat-label">삭제됨</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="modifiedCount">0</div>
                    <div class="stat-label">수정됨</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">총 줄</div>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th class="before-col">이전 버전</th>
                        <th class="after-col">새로운 버전</th>
                    </tr>
                </thead>
                <tbody id="comparisonTable">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let pdf1Text = '';
        let pdf2Text = '';
        const pdfjs = window.pdfjsWorker = pdfjsWorker = { workerSrc: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' };

        document.getElementById('file1').addEventListener('change', function(e) {
            document.getElementById('file1-name').textContent = e.target.files[0]?.name || '';
            updateCompareBtn();
        });

        document.getElementById('file2').addEventListener('change', function(e) {
            document.getElementById('file2-name').textContent = e.target.files[0]?.name || '';
            updateCompareBtn();
        });

        function updateCompareBtn() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            document.getElementById('compareBtn').disabled = !file1 || !file2;
        }

        async function extractTextFromPDF(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const pdf = await pdfjsLib.getDocument(e.target.result).promise;
                        let text = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            const pageText = content.items.map(item => item.str).join(' ');
                            text += pageText + '\n';
                        }
                        resolve(text);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function getLines(text) {
            return text.split('\n').filter(line => line.trim());
        }

        function computeDiff(lines1, lines2) {
            const diff = [];
            const maxLen = Math.max(lines1.length, lines2.length);

            for (let i = 0; i < maxLen; i++) {
                const line1 = lines1[i] || '';
                const line2 = lines2[i] || '';

                if (line1 === line2) {
                    diff.push({ before: line1, after: line2, type: 'same' });
                } else if (line1 && !line2) {
                    diff.push({ before: line1, after: '', type: 'removed' });
                } else if (!line1 && line2) {
                    diff.push({ before: '', after: line2, type: 'added' });
                } else {
                    diff.push({ before: line1, after: line2, type: 'modified' });
                }
            }
            return diff;
        }

        function displayComparison(diffs) {
            const tbody = document.getElementById('comparisonTable');
            tbody.innerHTML = '';

            let addedCount = 0, removedCount = 0, modifiedCount = 0;

            diffs.forEach(diff => {
                const row = document.createElement('tr');

                const beforeCell = document.createElement('td');
                beforeCell.className = 'before-col';
                if (diff.type === 'removed') {
                    beforeCell.innerHTML = `<span class="removed">${escapeHtml(diff.before)}</span>`;
                    removedCount++;
                } else if (diff.type === 'modified') {
                    beforeCell.innerHTML = `<span class="modified">${escapeHtml(diff.before)}</span>`;
                } else {
                    beforeCell.innerHTML = `<span class="same">${escapeHtml(diff.before)}</span>`;
                }

                const afterCell = document.createElement('td');
                afterCell.className = 'after-col';
                if (diff.type === 'added') {
                    afterCell.innerHTML = `<span class="added">${escapeHtml(diff.after)}</span>`;
                    addedCount++;
                } else if (diff.type === 'modified') {
                    afterCell.innerHTML = `<span class="modified">${escapeHtml(diff.after)}</span>`;
                    modifiedCount++;
                } else {
                    afterCell.innerHTML = `<span class="same">${escapeHtml(diff.after)}</span>`;
                }

                row.appendChild(beforeCell);
                row.appendChild(afterCell);
                tbody.appendChild(row);
            });

            document.getElementById('addedCount').textContent = addedCount;
            document.getElementById('removedCount').textContent = removedCount;
            document.getElementById('modifiedCount').textContent = modifiedCount;
            document.getElementById('totalCount').textContent = diffs.length;

            document.getElementById('comparisonSection').classList.add('show');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        document.getElementById('compareBtn').addEventListener('click', async function() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];

            if (!file1 || !file2) {
                showError('두 파일을 모두 선택해주세요.');
                return;
            }

            showLoading(true);
            hideError();

            try {
                pdf1Text = await extractTextFromPDF(file1);
                pdf2Text = await extractTextFromPDF(file2);

                const lines1 = getLines(pdf1Text);
                const lines2 = getLines(pdf2Text);
                const diffs = computeDiff(lines1, lines2);

                displayComparison(diffs);
            } catch (error) {
                showError('PDF 파일을 처리하는 중 오류가 발생했습니다: ' + error.message);
            } finally {
                showLoading(false);
            }
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            document.getElementById('file1').value = '';
            document.getElementById('file2').value = '';
            document.getElementById('file1-name').textContent = '';
            document.getElementById('file2-name').textContent = '';
            document.getElementById('comparisonSection').classList.remove('show');
            document.getElementById('comparisonTable').innerHTML = '';
            hideError();
            updateCompareBtn();
        });

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            document.getElementById('error').classList.remove('show');
        }
    </script>
</body>
</html>
